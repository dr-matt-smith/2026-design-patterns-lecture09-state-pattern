<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 126 100" width="126" height="100" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);font:14px sans-serif;font-family:var(--pele-font,'Helvetica Neue', Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="decision"><defs><marker id="pele-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--_l)"/></marker></defs><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-width="1.5"><line class="pele-edge" x1="46" y1="50" x2="122" y2="14" marker-end="url(#pele-arrow)"/><line class="pele-edge" x1="46" y1="50" x2="122" y2="86" marker-end="url(#pele-arrow)"/></g><g class="pele-edge-labels" text-anchor="middle"><text class="pele-label" transform="translate(84,32) rotate(-25.35)" y="-5">[c1]</text><text class="pele-label" transform="translate(84,68) rotate(25.35)" y="15">[c2]</text></g><g class="pele-nodes"><g class="pele-node pele-decision" data-id="decision" transform="translate(24,50)"><polygon points="0,-14 22,0 0,14 -22,0" fill="var(--_s)" stroke="var(--_b)" stroke-linejoin="round"/></g></g></svg>
